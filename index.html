<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Birthday Celebrant Flyer</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 20px;

            background: #eeeeee;

            font-family: Arial, sans-serif;

        }


        .container {

            width: 100%;

            max-width: 600px;

            margin: auto;

        }


        /* =================================
           FLYER
        ================================= */

        #flyer {

            position: relative;

            width: 100%;

            aspect-ratio: 1102 / 1374;

            overflow: hidden;

            background: white;

        }


        /* =================================
           ORIGINAL FLYER
        ================================= */

        #flyerBackground {

            position: absolute;

            left: 0;

            top: 0;

            width: 100%;

            height: 100%;

            object-fit: fill;

            z-index: 1;

        }


        /* =================================
           PHOTO FRAME
        ================================= */

        #photoBox {

            position: absolute;

            left: 33.6%;

            top: 36.7%;

            width: 32.4%;

            height: 34.4%;

            overflow: hidden;

            z-index: 2;

            background: transparent;

            touch-action: none;

            cursor: grab;

        }


        #photoBox.dragging {

            cursor: grabbing;

        }


        /* =================================
           USER PHOTO
        ================================= */

        #userPhoto {

            position: absolute;

            left: 50%;

            top: 50%;

            width: 100%;

            height: 100%;

            object-fit: cover;

            object-position: center;

            transform:
                translate(
                    calc(-50% + var(--x)),
                    calc(-50% + var(--y))
                )
                scale(var(--zoom));

            transform-origin: center center;

            display: none;

            user-select: none;

            -webkit-user-drag: none;

            pointer-events: none;

        }


        /* =================================
           CONTROLS
        ================================= */

        .controls {

            margin-top: 20px;

            display: flex;

            flex-direction: column;

            gap: 12px;

        }


        /* =================================
           UPLOAD BUTTON
        ================================= */

        .uploadButton {

            display: block;

            width: 100%;

            padding: 16px;

            background: #063b9e;

            color: white;

            text-align: center;

            font-size: 17px;

            font-weight: bold;

            border-radius: 8px;

            cursor: pointer;

        }


        .uploadButton:active {

            transform: scale(0.98);

        }


        #photoInput {

            display: none;

        }


        /* =================================
           ZOOM AREA
        ================================= */

        .zoomArea {

            background: white;

            padding: 15px;

            border-radius: 8px;

        }


        .zoomTitle {

            text-align: center;

            font-weight: bold;

            margin-bottom: 10px;

            color: #222;

        }


        #zoomSlider {

            width: 100%;

            cursor: pointer;

        }


        .zoomButtons {

            display: flex;

            gap: 10px;

            margin-top: 10px;

        }


        .zoomButtons button {

            flex: 1;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #e5e5e5;

            font-size: 20px;

            font-weight: bold;

            cursor: pointer;

        }


        /* =================================
           RESET
        ================================= */

        #resetButton {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #555;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

        }


        /* =================================
           DOWNLOAD
        ================================= */

        #downloadButton {

            width: 100%;

            padding: 16px;

            background: #111111;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }


        #downloadButton:active {

            transform: scale(0.98);

        }


        /* =================================
           INSTRUCTION
        ================================= */

        .instruction {

            text-align: center;

            margin-top: 12px;

            color: #555;

            font-size: 14px;

            line-height: 1.5;

        }


        /* =================================
           ERROR
        ================================= */

        #errorMessage {

            display: none;

            margin-top: 15px;

            padding: 12px;

            background: #ffe5e5;

            color: #b00000;

            text-align: center;

            border-radius: 6px;

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =====================================
         FLYER
    ====================================== -->

    <div id="flyer">


        <!-- ORIGINAL FLYER -->

        <img
            id="flyerBackground"
            src="flyer.jpg"
            alt="Birthday Flyer"
        >


        <!-- PHOTO FRAME -->

        <div id="photoBox">

            <img
                id="userPhoto"
                alt="Celebrant Photo"
            >

        </div>


    </div>



    <!-- =====================================
         CONTROLS
    ====================================== -->

    <div class="controls">


        <!-- UPLOAD -->

        <label
            for="photoInput"
            class="uploadButton"
        >

            📷 Upload Your Photo

        </label>


        <input
            type="file"
            id="photoInput"
            accept="image/*"
        >



        <!-- =================================
             ZOOM
        ================================== -->

        <div class="zoomArea">


            <div class="zoomTitle">

                Zoom Photo

            </div>


            <input
                type="range"
                id="zoomSlider"
                min="1"
                max="3"
                step="0.01"
                value="1"
            >


            <div class="zoomButtons">


                <button id="zoomOut">

                    −

                </button>


                <button id="zoomIn">

                    +

                </button>


            </div>

        </div>



        <!-- RESET -->

        <button id="resetButton">

            🔄 Reset Photo Position

        </button>



        <!-- DOWNLOAD -->

        <button id="downloadButton">

            ⬇ Download Flyer

        </button>


    </div>



    <div class="instruction">

        After uploading your photo, drag the photo
        with your finger to position it correctly.
        Use the slider or + / − buttons to zoom.

    </div>



    <div id="errorMessage">

        Flyer image could not be found.
        Make sure your flyer is named
        <strong>flyer.jpg</strong>
        and is in the same folder as this HTML file.

    </div>


</div>



<script>


/* =========================================
   GET ELEMENTS
========================================= */

const photoInput =
    document.getElementById("photoInput");

const flyer =
    document.getElementById("flyer");

const flyerBackground =
    document.getElementById("flyerBackground");

const photoBox =
    document.getElementById("photoBox");

const userPhoto =
    document.getElementById("userPhoto");

const zoomSlider =
    document.getElementById("zoomSlider");

const zoomIn =
    document.getElementById("zoomIn");

const zoomOut =
    document.getElementById("zoomOut");

const resetButton =
    document.getElementById("resetButton");

const downloadButton =
    document.getElementById("downloadButton");

const errorMessage =
    document.getElementById("errorMessage");



/* =========================================
   PHOTO POSITION
========================================= */

let photoX = 0;

let photoY = 0;

let zoom = 1;



/* =========================================
   APPLY PHOTO TRANSFORM
========================================= */

function updatePhoto() {

    userPhoto.style.setProperty(
        "--x",
        photoX + "px"
    );

    userPhoto.style.setProperty(
        "--y",
        photoY + "px"
    );

    userPhoto.style.setProperty(
        "--zoom",
        zoom
    );

    zoomSlider.value = zoom;

}



/* =========================================
   UPLOAD PHOTO
========================================= */

photoInput.addEventListener(
    "change",
    function () {


        const file =
            photoInput.files[0];


        if (!file) {

            return;

        }


        if (!file.type.startsWith("image/")) {

            alert(
                "Please select an image."
            );

            return;

        }


        const imageURL =
            URL.createObjectURL(file);


        userPhoto.onload = function () {

            photoX = 0;

            photoY = 0;

            zoom = 1;

            updatePhoto();

            userPhoto.style.display =
                "block";

        };


        userPhoto.src =
            imageURL;

    }
);



/* =========================================
   DRAGGING
========================================= */

let dragging = false;

let startPointerX = 0;

let startPointerY = 0;

let startPhotoX = 0;

let startPhotoY = 0;



/* =========================================
   START DRAG
========================================= */

photoBox.addEventListener(
    "pointerdown",
    function (event) {


        if (
            !userPhoto.src ||
            userPhoto.style.display === "none"
        ) {

            return;

        }


        dragging = true;


        photoBox.classList.add(
            "dragging"
        );


        startPointerX =
            event.clientX;


        startPointerY =
            event.clientY;


        startPhotoX =
            photoX;


        startPhotoY =
            photoY;


        photoBox.setPointerCapture(
            event.pointerId
        );


        event.preventDefault();

    }
);



/* =========================================
   DRAG PHOTO
========================================= */

photoBox.addEventListener(
    "pointermove",
    function (event) {


        if (!dragging) {

            return;

        }


        const moveX =
            event.clientX -
            startPointerX;


        const moveY =
            event.clientY -
            startPointerY;


        photoX =
            startPhotoX + moveX;


        photoY =
            startPhotoY + moveY;


        updatePhoto();


        event.preventDefault();

    }
);



/* =========================================
   STOP DRAG
========================================= */

photoBox.addEventListener(
    "pointerup",
    function () {

        dragging = false;

        photoBox.classList.remove(
            "dragging"
        );

    }
);


photoBox.addEventListener(
    "pointercancel",
    function () {

        dragging = false;

        photoBox.classList.remove(
            "dragging"
        );

    }
);



/* =========================================
   ZOOM SLIDER
========================================= */

zoomSlider.addEventListener(
    "input",
    function () {

        zoom =
            parseFloat(
                zoomSlider.value
            );

        updatePhoto();

    }
);



/* =========================================
   ZOOM IN
========================================= */

zoomIn.addEventListener(
    "click",
    function () {


        zoom += 0.1;


        if (zoom > 3) {

            zoom = 3;

        }


        updatePhoto();

    }
);



/* =========================================
   ZOOM OUT
========================================= */

zoomOut.addEventListener(
    "click",
    function () {


        zoom -= 0.1;


        if (zoom < 1) {

            zoom = 1;

        }


        updatePhoto();

    }
);



/* =========================================
   RESET
========================================= */

resetButton.addEventListener(
    "click",
    function () {


        photoX = 0;

        photoY = 0;

        zoom = 1;


        updatePhoto();

    }
);



/* =========================================
   CHECK FLYER
========================================= */

flyerBackground.addEventListener(
    "error",
    function () {

        errorMessage.style.display =
            "block";

    }
);



/* =========================================
   DOWNLOAD FLYER
========================================= */

downloadButton.addEventListener(
    "click",
    function () {


        if (
            !userPhoto.src ||
            userPhoto.style.display === "none"
        ) {

            alert(
                "Please upload a photo first."
            );

            return;

        }


        /*
         * Original flyer dimensions
         */

        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width = 1102;

        canvas.height = 1374;


        const ctx =
            canvas.getContext("2d");



        /* =================================
           DRAW ORIGINAL FLYER
        ================================= */

        ctx.drawImage(
            flyerBackground,
            0,
            0,
            1102,
            1374
        );



        /* =================================
           PHOTO BOX COORDINATES
        =================================

           These coordinates correspond
           to the white area in your flyer.
        */

        const photoXCanvas =
            370;


        const photoYCanvas =
            504;


        const photoWidthCanvas =
            357;


        const photoHeightCanvas =
            473;



        /* =================================
           LOAD USER PHOTO
        ================================= */

        const image =
            new Image();


        image.onload =
            function () {


                const imageWidth =
                    image.naturalWidth;


                const imageHeight =
                    image.naturalHeight;



                /* ==========================
                   BASE COVER SCALE
                ========================== */

                const coverScale =
                    Math.max(

                        photoWidthCanvas /
                        imageWidth,

                        photoHeightCanvas /
                        imageHeight

                    );



                const baseWidth =
                    imageWidth *
                    coverScale;


                const baseHeight =
                    imageHeight *
                    coverScale;



                /* ==========================
                   APPLY ZOOM
                ========================== */

                const finalWidth =
                    baseWidth * zoom;


                const finalHeight =
                    baseHeight * zoom;



                /* ==========================
                   CENTER IMAGE
                ========================== */

                const drawX =

                    photoXCanvas +

                    (
                        photoWidthCanvas -
                        finalWidth
                    ) / 2 +

                    (
                        photoX *
                        1102 /
                        flyer.clientWidth
                    );



                const drawY =

                    photoYCanvas +

                    (
                        photoHeightCanvas -
                        finalHeight
                    ) / 2 +

                    (
                        photoY *
                        1374 /
                        flyer.clientHeight
                    );



                /* ==========================
                   CLIP TO PHOTO FRAME
                ========================== */

                ctx.save();


                ctx.beginPath();


                ctx.rect(

                    photoXCanvas,

                    photoYCanvas,

                    photoWidthCanvas,

                    photoHeightCanvas

                );


                ctx.clip();



                /* ==========================
                   DRAW PHOTO
                ========================== */

                ctx.drawImage(

                    image,

                    drawX,

                    drawY,

                    finalWidth,

                    finalHeight

                );



                ctx.restore();



                /* ==========================
                   DOWNLOAD
                ========================== */

                const downloadLink =
                    document.createElement(
                        "a"
                    );


                downloadLink.download =
                    "birthday-celebrant-flyer.png";


                downloadLink.href =
                    canvas.toDataURL(
                        "image/png"
                    );


                downloadLink.click();

            };



        image.src =
            userPhoto.src;

    }
);



/* =========================================
   INITIAL SETTINGS
========================================= */

updatePhoto();


</script>


</body>

</html>
